name: Prebuilt libraries
on:
  push:
    branches: [ikuuu-prebuilt]
    tags: ['ikuuu-libui-*']
  pull_request:
    branches: [ikuuu-prebuilt]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux, arch: x64, container: 'ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214'}
          - {os: ubuntu-24.04-arm, platform: linux, arch: arm64, container: 'ubuntu:20.04@sha256:8feb4d8ca5354def3d8fce243717141ce31e2c428701f6682bd2fafe15388214'}
          - {os: windows-2022, platform: windows, arch: x64}
          - {os: macos-15-intel, platform: macos, arch: x64}
          - {os: macos-15, platform: macos, arch: arm64}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y git ca-certificates python3-venv build-essential pkg-config libgtk-3-dev xvfb
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and check library
        env:
          LIBUI_PLATFORM: ${{ matrix.platform }}
          LIBUI_ARCH: ${{ matrix.arch }}
        run: python3 packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: libui-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/ikuuu-libui-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Record checksums
        run: cd dist && sha256sum *.zip > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/*
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          printf 'Source commit: `%s`\n\nLinux: glibc <= 2.31. Windows: static MSVC runtime.\n' "$SOURCE_SHA" > notes.md
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file notes.md
